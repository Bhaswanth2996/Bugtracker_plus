version: "3.9"

services:
  mongodb:
    image: mongo:8
    container_name: bugtracker-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: bugtracker-backend
    restart: unless-stopped
    environment:
      BUGTRACKER_APP_ENV: development
      BUGTRACKER_JWT_SECRET_KEY: this-should-be-replaced-in-prod
      BUGTRACKER_MONGODB_URI: mongodb://mongodb:27017
      BUGTRACKER_MONGODB_DB_NAME: bugtrackerplus
      BUGTRACKER_CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      - mongodb
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bugtracker-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongo_data:
