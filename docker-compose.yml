version: "3.9"

services:
  mongodb:
    image: mongo:8
    container_name: bugtracker-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: bugtracker-backend
    restart: unless-stopped
    environment:
      BUGTRACKER_APP_ENV: development
      BUGTRACKER_STORE_BACKEND: mongodb
      BUGTRACKER_JWT_SECRET_KEY: this-should-be-replaced-in-prod
      BUGTRACKER_MONGODB_URI: mongodb://mongodb:27017
      BUGTRACKER_MONGODB_DB_NAME: bugtrackerplus
      BUGTRACKER_CORS_ORIGINS: '["http://localhost:5173"]'
      BUGTRACKER_LOCAL_UPLOAD_DIR: uploads
      BUGTRACKER_ENABLE_DEMO_SEED: "true"
    depends_on:
      - mongodb
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: bugtracker-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

  selenium:
    image: selenium/standalone-chrome:134.0
    container_name: bugtracker-selenium
    shm_size: 2gb
    ports:
      - "4444:4444"

volumes:
  mongo_data:
  backend_uploads:
